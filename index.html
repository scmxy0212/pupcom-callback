<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pupcom designer</title>
<style>
  :root { --ink: #0c1f1f; --ink-3: #66716f; --bg: #f7f6f2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #eef2f1; --ink-3: #9aa7a5; --bg: #0f1716; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-align: center; }
  b { font-size: 28px; letter-spacing: -0.02em; } p { color: var(--ink-3); margin: 6px 0 0; }
</style>
</head>
<body><main><b>pupcom</b><p>设计师合作平台，即将上线。</p></main></body>
</html>
